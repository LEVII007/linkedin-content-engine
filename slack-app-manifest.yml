display_information:
  name: Supreet Content Assistant
  description: Turns Supreet's private Slack thoughts into reviewable LinkedIn drafts
  background_color: "#172554"
features:
  bot_user:
    display_name: Content Assistant
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - groups:history
      - reactions:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
