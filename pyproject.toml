[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "supreet-linkedin-engine"
version = "2.0.0"
description = "Slack-first, human-approved LinkedIn drafting and publishing"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
linkedin-engine = "content_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
